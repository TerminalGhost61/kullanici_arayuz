<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Dijital Dünyam - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #09090b; 
            --card: #18181b; 
            --accent: #2dd4bf; 
            --text: #fafafa; 
            --dim: #a1a1aa; 
            --border: #27272a;
        }
        
        * { box-sizing: border-box; }
        html { overflow-y: scroll; } 
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        
        .container { max-width: 1400px; margin: auto; display: grid; grid-template-columns: 350px 1fr 300px; gap: 25px; }

        header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        #clock { font-size: 2.2rem; font-weight: 700; color: var(--accent); }
        .search-form { flex-grow: 1; max-width: 400px; }
        input[type="text"] { width: 100%; padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: white; outline: none; }

        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; position: relative; }
        
        /* Pomodoro Ayar Butonu (SAĞ ÜST) */
        .pomo-settings-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--dim);
            cursor: pointer;
            transition: 0.3s;
            padding: 5px;
            z-index: 10;
        }
        .pomo-settings-btn:hover { color: var(--accent); transform: rotate(45deg); }

        .pomo-container { text-align: center; padding: 10px 0; position: relative; }
        .timer-circle { position: relative; width: 180px; height: 180px; margin: 0 auto 20px; }
        .timer-circle svg { transform: rotate(-90deg); width: 180px; height: 180px; }
        .timer-circle circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .bg-circle { stroke: var(--border); }
        .progress-circle { stroke: var(--accent); stroke-dasharray: 534; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
        #timer-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; font-weight: 700; }
        
        main { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            min-height: 580px; 
            transition: opacity 0.3s ease;
        }

        main.news-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .news-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .news-header h2 { margin: 0; font-size: 1.2rem; color: var(--accent); letter-spacing: 1px; }
        
        #news-list { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }
        .news-item { 
            padding: 15px; 
            border-radius: 12px; 
            background: #27272a40; 
            border-left: 4px solid var(--accent);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .news-item:hover { background: #27272a80; transform: translateX(8px); }
        .news-title { font-size: 0.95rem; font-weight: 500; margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        #settings-panel {
            position: fixed; 
            top: 0; 
            right: -400px;
            width: 300px; 
            height: 100%;
            background: var(--card); 
            border-left: 1px solid var(--border);
            z-index: 1000; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 30px; 
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        #settings-panel.open { right: 0; }
        
        .panel-close { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: var(--dim); font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .panel-close:hover { color: var(--accent); transform: scale(1.1); }

        .panel-section { margin-bottom: 30px; }
        .panel-section h3 { font-size: 0.9rem; color: var(--dim); margin-bottom: 15px; text-transform: uppercase; }
        
        .switch-container { display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 12px; border-radius: 12px; margin-bottom: 20px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

        .category-btn { display: block; width: 100%; text-align: left; padding: 12px; margin-bottom: 8px; background: #27272a; border: 1px solid transparent; color: white; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .category-btn.active { border-color: var(--accent); background: #2dd4bf20; color: var(--accent); }
        .disabled-category { opacity: 0.3; pointer-events: none; filter: grayscale(1); }

        .right-column { display: flex; flex-direction: column; gap: 20px; }
        .weather-card { background: var(--card); padding: 20px; border-radius: 20px; text-align: center; border: 1px solid var(--border); }
        .note-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        textarea { width: 100%; flex-grow: 1; min-height: 300px; background: transparent; border: none; color: #d1d5db; resize: none; outline: none; line-height: 1.6; font-family: inherit; }

        .btn { border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 0.85rem; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-secondary { background: #27272a; color: white; }

        .settings-trigger { background: none; border: none; color: var(--dim); cursor: pointer; transition: 0.3s; }
        .settings-trigger:hover { color: var(--accent); transform: rotate(45deg); }

        /* Modal Stilleri */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 1100; justify-content: center; align-items: center; }
        .modal-content { position: relative; background: var(--card); padding: 40px 30px; border-radius: 24px; border: 1px solid #3f3f46; text-align: center; width: 280px; }
        .modal-content input { width: 120px; padding: 15px; border-radius: 12px; border: 1px solid #3f3f46; background: #09090b; color: var(--accent); text-align: center; font-size: 1.8rem; font-weight: 700; margin: 20px 0; outline: none; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--dim); font-size: 1.2rem; cursor: pointer; }
        .modal-close:hover { color: #ff4d4d; }

        @media (max-width: 1200px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="settings-panel">
    <button class="panel-close" onclick="togglePanel(event)">✕</button>
    <div class="panel-section">
        <h3>Genel Görünüm</h3>
        <div class="switch-container">
            <span style="font-size: 0.85rem;">Haberleri Göster</span>
            <label class="switch">
                <input type="checkbox" id="news-toggle" checked onchange="toggleNewsDisplay()">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    <div class="panel-section" id="category-section">
        <h3>Haber Kategorisi</h3>
        <button class="category-btn active" onclick="changeCategory('technology', this)">💻 Teknoloji</button>
        <button class="category-btn" onclick="changeCategory('science', this)">🧪 Bilim</button>
        <button class="category-btn" onclick="changeCategory('space', this)">🚀 Uzay</button>
        <button class="category-btn" onclick="changeCategory('business', this)">📊 Ekonomi</button>
    </div>
</div>

<div id="modal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div style="font-weight: 700; color: var(--accent); font-size: 1.2rem;">SÜRE AYARI</div>
        <input type="number" id="mins" value="25" min="1">
        <button class="btn btn-primary" style="width: 100%;" onclick="applySettings()">Güncelle</button>
    </div>
</div>

<div class="container">
    <header>
        <div id="clock">00:00</div>
        <form class="search-form" action="https://www.google.com/search" method="get">
            <input type="text" name="q" placeholder="Google'da ara..." autocomplete="off">
        </form>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div id="date" style="font-size: 0.9rem; color: var(--dim);">-- -- ----</div>
            <button class="settings-trigger" id="settings-btn" onclick="togglePanel(event)">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
        </div>
    </header>

    <aside class="sidebar">
        <div class="card">
            <button class="pomo-settings-btn" onclick="openModal()" title="Süreyi Ayarla">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7zm7.43-2.52a4.85 4.85 0 0 0 0-1.96l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a4.83 4.83 0 0 0-1.7-1l-.37-2.65A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.49.42l-.37 2.65a4.83 4.83 0 0 0-1.7 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65a4.85 4.85 0 0 0 0 1.96l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1a4.83 4.83 0 0 0 1.7 1l.37 2.65a.5.5 0 0 0 .49.42h4a.5.5 0 0 0 .49-.42l.37-2.65a4.83 4.83 0 0 0 1.7-1l2.49 1a.5.5 0 0 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65z"/></svg>
            </button>

            <div class="pomo-container">
                <div class="timer-circle">
                    <svg><circle class="bg-circle" cx="90" cy="90" r="85"></circle><circle id="progress" class="progress-circle" cx="90" cy="90" r="85"></circle></svg>
                    <div id="timer-display">25:00</div>
                </div>
                <div class="btn-group" style="display:flex; justify-content:center; gap:10px;">
                    <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Başlat</button>
                    <button class="btn btn-secondary" onclick="resetTimer()">Sıfırla</button>
                </div>
            </div>
        </div>
    </aside>

    <main id="news-main-container">
        <div class="news-header">
            <h2 id="news-category-title">TEKNOLOJİ HABERLERİ</h2>
            <div id="news-status" style="font-size: 0.7rem; color: var(--accent);">Güncelleniyor...</div>
        </div>
        <div id="news-list"></div>
    </main>

    <div class="right-column">
        <div class="weather-card">
            <div id="city-name" style="font-size: 0.8rem; color: var(--dim); margin-bottom: 5px;">ŞEHİR</div>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <span id="weather-icon" style="font-size: 2.2rem;">☀️</span>
                <span id="current-temp" style="font-size: 2rem; font-weight: 700;">--°C</span>
            </div>
            <div id="weather-desc" style="font-size: 0.75rem; color: var(--dim); margin-top: 5px;">Yükleniyor...</div>
        </div>
        <div class="note-card">
            <div style="border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; font-weight: 700; color: var(--accent);">📝 NOTLAR</div>
            <textarea id="noteSaver" placeholder="Buraya yazın..."></textarea>
        </div>
    </div>
</div>

<script>
    // HABERLERİ AÇIP KAPATMA
    function toggleNewsDisplay() {
        const isChecked = document.getElementById('news-toggle').checked;
        const main = document.getElementById('news-main-container');
        const categoryBtns = document.querySelectorAll('#category-section .category-btn');

        if (isChecked) {
            main.classList.remove('news-hidden');
            categoryBtns.forEach(btn => btn.classList.remove('disabled-category'));
            localStorage.setItem('newsVisible', 'true');
        } else {
            main.classList.add('news-hidden');
            categoryBtns.forEach(btn => btn.classList.add('disabled-category'));
            localStorage.setItem('newsVisible', 'false');
        }
    }

    // SAAT VE TARİH
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('date').textContent = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });
    }
    setInterval(updateClock, 1000); updateClock();

    // PANEL VE MODAL YÖNETİMİ
    function togglePanel(event) {
        if (event) event.stopPropagation();
        document.getElementById('settings-panel').classList.toggle('open');
    }

    function openModal() { 
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('mins').focus();
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    // ESC TUŞU İLE KAPATMA
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            closeModal();
            document.getElementById('settings-panel').classList.remove('open');
        }
    });

    // DIŞARI TIKLANINCA KAPATMA
    document.addEventListener('click', function(event) {
        const panel = document.getElementById('settings-panel');
        const trigger = document.getElementById('settings-btn');
        if (!panel.contains(event.target) && !trigger.contains(event.target)) {
            panel.classList.remove('open');
        }
    });

    // HABER SİSTEMİ
    let currentCategory = 'technology';
    const categories = {
    technology: [
        'https://shiftdelete.net/feed',           // Güncel donanım, yazılım ve mobil haberleri
        'https://www.donanimhaber.com/rss/tum/',    // Türkiye'nin en köklü teknoloji topluluğu
        'https://www.log.com.tr/feed/'             // Tasarım ve teknoloji odaklı güncel haberler
    ],
    science: [
        'https://evrimagaci.org/rss.xml',          // Kapsamlı bilimsel makaleler ve evrimsel biyoloji
        'https://popsci.com.tr/feed/',             // Popüler bilim dünyasından en son gelişmeler
        'https://fizikist.com/feed/'               // Uzay, fizik ve genel bilim haberleri
    ],
   space: [
        'https://bilimgenc.tubitak.gov.tr/rss.xml',      // TÜBİTAK Bilim Genç (Çok kararlı)
        'https://www.donanimhaber.com/rss/havacilik-ve-uzay/', // DonanımHaber Uzay Kategorisi
        'https://fizikist.com/kategori/uzay/feed/'       // Fizikist Uzay Bölümü
    ],
    business: [
        'https://www.bloomberght.com/rss',         // Anlık finans, borsa ve piyasa verileri
        'https://www.ekonomim.com/rss',            // Günlük ekonomi ve iş dünyası analizleri
        'https://www.para-borsa.net/feed/'         // Yatırım ve ekonomi odaklı güncel başlıklar
    ]
};

    async function translateTitle(text) {
        if(/[ğĞçÇşŞüÜöÖıİ]/.test(text)) return text;
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|tr`);
            const data = await res.json();
            return data.responseData.translatedText || text;
        } catch (e) { return text; }
    }

    async function fetchNews() {
        const newsList = document.getElementById('news-list');
        const status = document.getElementById('news-status');
        if(!newsList) return;
        
        status.textContent = "Yükleniyor...";
        try {
            const urls = categories[currentCategory];
            const fetchPromises = urls.map(url => fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`).then(res => res.json()));
            const results = await Promise.all(fetchPromises);
            let allItems = [];
            results.forEach(data => { if(data.status === 'ok') allItems.push(...data.items); });
            allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
            
            let finalHTML = "";
            for (const item of allItems.slice(0, 5)) {
                const trTitle = await translateTitle(item.title);
                finalHTML += `<a class="news-item" href="${item.link}" target="_blank"><div class="news-title">${trTitle}</div></a>`;
            }
            newsList.innerHTML = finalHTML;
            status.textContent = "Güncel";
        } catch (e) { status.textContent = "Hata!"; }
    }

function changeCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('#category-section .category-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // --- BURASI AYARLIYOR ---
    let baslik = cat.toUpperCase(); // Varsayılan olarak kelimeyi büyütür (SCIENCE)
    if(cat === 'science') baslik = 'BİLİM';
    if(cat === 'space') baslik = 'UZAY';
    if(cat === 'technology') baslik = 'TEKNOLOJİ';
    if(cat === 'business') baslik = 'EKONOMİ';

    document.getElementById('news-category-title').textContent = baslik + " HABERLERİ";
    // ------------------------
    
    fetchNews();
}

    // POMODORO SİSTEMİ
    let totalSeconds = 1500, initialSeconds = 1500, timerId = null;
    const progressCircle = document.getElementById('progress'), circumference = 2 * Math.PI * 85;
    
    function applySettings() {
        const m = document.getElementById('mins').value;
        if(m > 0) {
            initialSeconds = m * 60; totalSeconds = initialSeconds;
            resetTimer(); closeModal();
        }
    }
    function updateDisplay() {
        const m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
        document.getElementById('timer-display').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        progressCircle.style.strokeDashoffset = circumference - (totalSeconds / initialSeconds) * circumference;
    }
    function toggleTimer() {
        if (timerId) { clearInterval(timerId); timerId = null; document.getElementById('startBtn').textContent = "Devam Et"; }
        else {
            document.getElementById('startBtn').textContent = "Durdur";
            timerId = setInterval(() => { if (totalSeconds > 0) { totalSeconds--; updateDisplay(); } else { clearInterval(timerId); alert("Süre bitti!"); } }, 1000);
        }
    }
    function resetTimer() { clearInterval(timerId); timerId = null; totalSeconds = initialSeconds; updateDisplay(); document.getElementById('startBtn').textContent = "Başlat"; }

    // HAVA DURUMU
    async function getWeather() {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=41.0082&longitude=28.9784&current_weather=true`);
            const data = await res.json();
            document.getElementById('current-temp').textContent = `${Math.round(data.current_weather.temperature)}°C`;
            document.getElementById('weather-desc').textContent = "İstanbul";
        } catch (e) { }
    }

    // SAYFA YÜKLENİNCE
    window.onload = () => {
        const visible = localStorage.getItem('newsVisible');
        if (visible === 'false') {
            document.getElementById('news-toggle').checked = false;
            toggleNewsDisplay();
        }
        getWeather();
        fetchNews();
        updateDisplay();
    };

    // NOT KAYDEDİCİ
    const noteArea = document.getElementById('noteSaver');
    noteArea.value = localStorage.getItem('userNote') || '';
    noteArea.addEventListener('input', () => localStorage.setItem('userNote', noteArea.value));
</script>

</body>
</html>
